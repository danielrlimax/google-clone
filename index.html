<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
    <title>Google</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


</head>
<body>
    <header class="header">
        <ul class="list-header">
            <li><a href="https://mail.google.com/mail/?authuser=0&ogbl">Gmail</a></li>
            <li><a href="https://www.google.com/imghp?hl=pt-BR&authuser=0&ogbl">Imagens</a></li>
            <li><a href="#"><i class="fa-solid fa-grip menu"></i></a></li>
            <li><a href="#"><i class="fa-solid fa-circle-user profile"></i></a></li>
        </ul>
    </header>

    <main>
        <section class="main-content">
            <div class="main-content-box">
                <img src="assets/imgs/google-white-logo.png" alt="Logo Google">
            </div>
            <div class="search-container">
                <button class="plus-btn extras"><i class="fa-solid fa-plus"></i></button>

                <input class="search-input extras" type="text" autofocus>
                <button class="extras"><i class="fa-solid fa-keyboard"></i></button>
                <button class="extras"><i class="fa-solid fa-microphone"></i></button>
                <button class="extras"><i class="fa-regular fa-camera"></i></button>

                <button class="search-btn extras"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="main-content-btn">
                <button>Pesquisa Google</button>
                <button onclick="window.location.href='https://doodles.google/'">Estou com sorte</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <section class="primary-footer">
            <span>Brasil</span>
        </section>
        <hr>
        <section class="secondary-footer">
            <ul class=" list-footer initial-list-footer">
                <li><a href="https://about.google/?fg=1">Sobre</a></li>
                <li><a href="https://www.google.com/intl/pt-BR_br/ads/?subid=ww-ww-et-g-awa-a-g_hpafoot1_1!o2&fg=1">Publicidade</a></li>
                <li><a href="https://www.google.com/services/?subid=ww-ww-et-g-awa-a-g_hpbfoot1_1!o2&fg=1">Negócios</a></li>
                <li><a href="https://google.com/search/howsearchworks/?fg=1">Como funciona a pesquisa</a></li>
            </ul>
            <ul class="list-footer second-list-footer">
                <li><a href="https://policies.google.com/privacy?hl=pt-BR&fg=1">Privacidade</a></li>
                <li><a href="https://policies.google.com/terms?hl=pt-BR&fg=1">Termos</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </section>
    </footer>
</body>
</html>
